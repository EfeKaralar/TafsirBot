[project]
name = "tafsirbot"
version = "0.1.0"
description = "AI-powered Quranic commentary assistant over a Tafsir RAG corpus"
# Pinned to 3.12: fastembed -> onnxruntime has no 3.13+ wheels, and
# scripts/ingestion/chunk.py shadows the stdlib `chunk` module removed in 3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    "qdrant-client>=1.9.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "psycopg[binary]>=3.2.0",
    "tqdm>=4.66.0",
    "tiktoken>=0.7.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "fastembed>=0.4.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
tafsirbot = "tafsirbot.cli.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tafsirbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires live Qdrant or Postgres (excluded by default)",
    "live: calls real LLM/embedding APIs and costs money (excluded by default)",
]
# Bare `pytest` stays offline and free.
addopts = "-m 'not integration and not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
# Legacy tree still carries import-time side effects and sys.path hacks;
# these are removed progressively across epic #38.
extend-exclude = ["scripts", "sources"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in defaults is idiomatic
    # This corpus is Arabic and its prose uses en-dashes. Flagging every
    # non-ASCII character as "ambiguous" is noise here, not a signal.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Legacy ingestion tests import via sys.path.insert, so imports cannot sit at the
# top of the file. Lifted when those modules move into the package (PR #29).
"tests/unit/test_chunk.py" = ["E402", "I001", "RUF059", "F401"]
"tests/unit/test_clean.py" = ["E402", "I001", "RUF059"]
"tests/unit/test_ayah_resolver.py" = ["E402", "I001"]
"tests/unit/test_quran_ref.py" = ["E402", "I001"]
"tests/unit/test_rag_poc.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.12"
files = ["src/tafsirbot"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["fastembed.*", "qdrant_client.*", "tiktoken.*", "bs4.*"]
ignore_missing_imports = true
